# Builds the downloadable launcher (launcher/vibehash_launcher.py) into one file per system, wraps the Windows one in
# the setup wizard (installer/VibeHash.iss, Inno Setup, which the Windows runner has), and attaches them to the
# GitHub release of a version tag, where vibehash.org's download button points:
#   https://github.com/VibeHash/vibehash/releases/latest/download/VibeHash-Setup.exe   (the wizard)
#   https://github.com/VibeHash/vibehash/releases/latest/download/VibeHash.exe         (the bare launcher)
# Runs on the same tags as publish.yml (git tag v0.5.18 && git push origin v0.5.18), and by hand from the Actions tab
# to try a build without a release. On Windows the build is windowed (no console: the launcher shows a small window
# of its own while it installs, then the app's window), with the brand icon (launcher/VibeHash.ico, made by
# scripts/make_icon.py) and pywebview inside, so `VibeHash.exe --window` hosts the app's window under the launcher's
# name and icon. macOS and Linux builds stay console programs. The .exe is not code-signed yet, which Windows
# SmartScreen warns about on first run (the site says so).
name: Build the launcher

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read  # the build job only reads the checkout; only the release job below gets write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: VibeHash.exe
          - os: macos-latest
            name: VibeHash-macos
          - os: ubuntu-latest
            name: VibeHash-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Test the launcher
        run: python -m unittest tests.test_launcher
      - name: Build one file (Windows, windowed, with the icon and pywebview)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet "pyinstaller==6.22.3" "pywebview==6.2.1"
          python -m PyInstaller --onefile --windowed --name VibeHash --icon launcher/VibeHash.ico --add-data "launcher/VibeHash.ico;." --collect-all webview --hidden-import clr --hidden-import clr_loader --hidden-import tkinter --hidden-import ed25519_verify --distpath dist launcher/vibehash_launcher.py
      - name: Wrap it in the setup wizard (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$v installer\VibeHash.iss
          Get-ChildItem dist
      # Code signing is switched off (`if: false`) until a code-signing certificate exists. Once it does, store it as
      # the secrets WINDOWS_CERT_PFX (base64) and WINDOWS_CERT_PASSWORD, delete the `if: false` line, and this step signs
      # dist/VibeHash.exe and dist/VibeHash-Setup.exe with signtool before they are uploaded to the release.
      - name: Sign the Windows files (disabled until a code-signing certificate exists)
        if: false
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\VibeHash.exe dist\VibeHash-Setup.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: Build one file (console)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --quiet pyinstaller==6.22.3
          python -m PyInstaller --onefile --console --name VibeHash --hidden-import ed25519_verify --distpath dist launcher/vibehash_launcher.py
      - name: Name it for the release
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then mv dist/VibeHash "dist/${{ matrix.name }}"; fi  # Windows: VibeHash.exe already
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}
            dist/VibeHash-Setup.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to attach the files to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the tag's release (made here if publish.yml hasn't)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Vibe Hash $tag" --notes "See HANDOFF.md for what changed."
          gh release upload "$tag" dist/VibeHash-Setup.exe dist/VibeHash.exe dist/VibeHash-macos dist/VibeHash-linux --repo "$GITHUB_REPOSITORY" --clobber
