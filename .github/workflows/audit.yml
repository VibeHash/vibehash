# Known vulnerabilities in what Vibe Hash installs: pip-audit against PyPI's advisory database (OSV), over the package
# with every extra (finetune, evo, app) as `pip install vibehash[...]` would resolve them today. Weekly, on pushes to
# main, and on pull requests that change dependencies. Not a required check: a new advisory can turn it red without
# blocking a merge, and the fix is a Dependabot PR (dependabot.yml) or a raised lower bound in pyproject.toml.
# PyTorch is left out: no extra declares it (`vibehash install-gpu` picks its build).
name: Dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  push:
    branches: [main]
    paths: [pyproject.toml, agents/requirements-train.txt, .github/workflows/audit.yml]
  pull_request:
    paths: [pyproject.toml, agents/requirements-train.txt, .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Vibe Hash with every extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[finetune,evo,app]" pip-audit
      - name: Audit what was installed
        # Not --strict: that also fails on a package it can't look up, and vibehash itself (built here from the
        # checkout) is one. A known vulnerability in anything installed still fails the step.
        run: python -m pip_audit --progress-spinner off --desc on
