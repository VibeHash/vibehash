# The fast tests on every push and pull request, on the oldest and a current supported Python.
# A pull request that only touches edge files (the app, the launcher, the dashboards, docs) runs just their own tests,
# without PyTorch: scripts/ci_scope.sh decides. Pushes to main always run everything.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # the nightly job below, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    # The push/PR jobs (scope, test, evo) never run on the nightly's triggers: test and evo need scope, so they skip too.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      modules: ${{ steps.scope.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="origin/${{ github.base_ref }}"; fi
          bash scripts/ci_scope.sh "$base" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - if: needs.scope.outputs.scope == 'none'
        run: echo "docs only, nothing to test"
      - if: needs.scope.outputs.scope == 'light'
        run: |
          python -m pip install -e .
          python -m unittest ${{ needs.scope.outputs.modules }}
      - if: needs.scope.outputs.scope == 'full'
        run: python -m pip install -e ".[finetune,evo,app]"
      # Every extra (finetune, evo, app) so discovery can import the Evo and window tests, then CPU PyTorch for
      # tests.test_deepseek, which also fetches DeepSeek's reference code from the Hub (~100 KB), and
      # tests.test_finetune, whose models are tiny and made up (real ones are opt-in: VIBEHASH_REAL_MODELS=1).
      - if: needs.scope.outputs.scope == 'full'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - if: needs.scope.outputs.scope == 'full'
        run: python -m unittest discover -s tests -p "test_*.py"  # discovery, so no module is ever left out of a list

  # Evo Hash's tests (tests.test_es, and test_es2's spec tests) on CPU PyTorch with transformers: their models are tiny
  # and made up, so nothing is downloaded. About 3.5 minutes on the owner's PC. test_es2's network test is left out
  # (its parent's round waits out a 321 s compute deadline on a slow machine) and its engine test needs a CUDA GPU.
  # Not a required check yet: it can go red without blocking a merge.
  evo:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[finetune,evo]
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest tests.test_es tests.test_es2.SpecTests tests.test_es2.TaskCycleTests tests.test_es2.AnchorTests tests.test_es2.FormatTests tests.test_es2.MixTests tests.test_es2.StarterTemplateTests tests.test_evo_hostile

  # Everything, nightly and by hand: every extra plus CPU PyTorch, the whole suite by discovery. The GPU-only tests
  # skip themselves (test_gpu and test_es2's engine test check for CUDA, test_network checks for PyTorch), so none
  # needs a CI switch. Not a required check, and it never runs on a push or pull request.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[finetune,evo,app]"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p "test_*.py"

  gitleaks:
    # Secrets and personal detail (hosts, IPs, user paths, handles); not gated by scope, so docs-only pull requests are scanned too.
    # A pinned, checksum-verified release binary (no license key needed); the rules are in .gitleaks.toml.
    # To bump it, change GITLEAKS_VERSION and GITLEAKS_SHA256 together (the checksum is the linux_x64 line of the
    # release's gitleaks_<version>_checksums.txt).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan a pull request's commits
        if: github.event_name == 'pull_request'
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner
          --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
      - name: Scan the checked-out tree (history still holds details already removed, so it is not rescanned)
        if: github.event_name != 'pull_request'
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --no-git --source . --config .gitleaks.toml --redact --no-banner
