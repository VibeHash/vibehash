# Publishes vibehash to PyPI when a version tag is pushed, e.g.:
#   git tag v0.4.0 && git push origin v0.4.0
# PyPI trusts this workflow through a "trusted publisher" (no API token is stored anywhere):
# project vibehash, owner AlphaChad5000, repository vibehash, workflow publish.yml, environment pypi.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"; exit 1
          fi
      # A release runs everything the fast tests job does (CPU PyTorch for the DeepSeek and fine-tune tests), found by
      # discovery so no module is ever left out of the list.
      - name: Install Vibe Hash and CPU PyTorch
        run: |
          python -m pip install -e .[finetune]
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run the tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build the wheel and source archive
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vibehash
    permissions:
      id-token: write  # what lets PyPI's trusted publishing recognise this workflow
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
